name: CI Build & Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Get version from commit count
      id: version
      run: echo "VERSION=v$(git rev-list --count HEAD)" >> $GITHUB_ENV

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        cache: 'npm'

    - name: Install dependencies
      run: npm install

    - name: Build Angular app
      run: npm run build:prod

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v2
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GHCR_TOKEN }}

    - name: Log in to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and Push Docker Image
      run: |
        docker build -t ghcr.io/afdaliable/quiz-frontend-prod:latest -t ghcr.io/afdaliable/quiz-frontend-prod:${{ env.VERSION }} .
        docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/quiz-frontend:latest .
        
        docker push ghcr.io/afdaliable/quiz-frontend-prod:latest
        docker push ghcr.io/afdaliable/quiz-frontend-prod:${{ env.VERSION }}
        docker push ${{ secrets.DOCKERHUB_USERNAME }}/quiz-frontend:latest

    - name: Delete old images from GHCR
      run: |
        gh auth login --with-token <<< "${{ secrets.GITHUB_TOKEN }}"
        IMAGES=$(gh api "orgs/${{ github.repository_owner }}/packages/container/quiz-frontend-prod/versions" | jq -r '.[].id' | tail -n +3)
        for IMG in $IMAGES; do
          gh api --method DELETE "orgs/${{ github.repository_owner }}/packages/container/quiz-frontend-prod/versions/$IMG"
        done

  deploy:
    name: Deploy ke Server
    needs: build 
    runs-on: self-hosted
    steps:
      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Pull Image Baru
        run: docker pull ghcr.io/afdaliable/quiz-frontend-prod:latest

      - name: Hentikan & Hapus Container Lama
        run: |
          docker stop quiz-frontend || true
          docker rm quiz-frontend || true

      - name: Jalankan Container Baru
        run: |
          docker run -d --name quiz-frontend \
            -p 4200:4200 \
            --network=bridge \
            --restart unless-stopped \
            ghcr.io/afdaliable/quiz-frontend-prod:latest 