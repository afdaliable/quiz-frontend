<div class="container mx-auto px-4 py-16 flex justify-center items-center min-h-screen" [ngClass]="isDarkMode ? 'bg-gray-900 text-white' : 'bg-white text-gray-900'">
  <div class="w-full max-w-md p-8 rounded-lg shadow-lg" [ngClass]="isDarkMode ? 'bg-gray-800' : 'bg-white border border-gray-200'">
    
    <div *ngIf="status === 'checking'" class="text-center">
      <div class="animate-spin rounded-full h-16 w-16 border-t-2 border-b-2 mx-auto mb-6" [ngClass]="isDarkMode ? 'border-white' : 'border-indigo-600'"></div>
      <h2 class="text-2xl font-bold mb-4" [ngClass]="isDarkMode ? 'text-white' : 'text-gray-900'">{{ message }}</h2>
      <p class="text-sm" [ngClass]="isDarkMode ? 'text-gray-400' : 'text-gray-600'">Please do not close this window</p>
    </div>
    
    <div *ngIf="status === 'pending'" class="text-center">
      <div class="animate-spin rounded-full h-16 w-16 border-t-2 border-b-2 mx-auto mb-6" [ngClass]="isDarkMode ? 'border-yellow-400' : 'border-yellow-600'"></div>
      <h2 class="text-2xl font-bold mb-4" [ngClass]="isDarkMode ? 'text-yellow-400' : 'text-yellow-700'">{{ message }}</h2>
      <p class="text-sm mb-4" [ngClass]="isDarkMode ? 'text-gray-400' : 'text-gray-600'">Please do not close this window. We're checking your payment status.</p>
      <div class="w-full bg-gray-200 rounded-full h-2.5 mb-4 dark:bg-gray-700">
        <div class="bg-yellow-600 h-2.5 rounded-full w-1/2"></div>
      </div>
    </div>
    
    <div *ngIf="status === 'success'" class="text-center">
      <div class="mx-auto mb-6 w-16 h-16 bg-green-100 rounded-full flex items-center justify-center">
        <svg class="w-10 h-10 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
        </svg>
      </div>
      <h2 class="text-2xl font-bold mb-4 text-green-600">{{ message }}</h2>
      <p class="text-sm mb-6" [ngClass]="isDarkMode ? 'text-gray-400' : 'text-gray-600'">Redirecting to premium content...</p>
      <div class="w-full bg-gray-200 rounded-full h-2.5 mb-4 dark:bg-gray-700">
        <div class="bg-green-600 h-2.5 rounded-full animate-progress"></div>
      </div>
    </div>
    
    <div *ngIf="status === 'error'" class="text-center">
      <div class="mx-auto mb-6 w-16 h-16 rounded-full flex items-center justify-center" [ngClass]="isDarkMode ? 'bg-red-900' : 'bg-red-100'">
        <svg class="w-10 h-10" [ngClass]="isDarkMode ? 'text-red-400' : 'text-red-600'" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
        </svg>
      </div>
      <h2 class="text-2xl font-bold mb-4" [ngClass]="isDarkMode ? 'text-red-400' : 'text-red-600'">Payment Error</h2>
      <p class="mb-6" [ngClass]="isDarkMode ? 'text-gray-300' : 'text-gray-700'">{{ error }}</p>
      
      <div class="flex flex-col space-y-3">
        <button 
          *ngIf="error.includes('session') || error.includes('log in')"
          (click)="login()" 
          class="w-full py-3 px-4 rounded-lg font-medium transition-colors duration-200 focus:outline-none focus:ring-2 focus:ring-offset-2"
          [ngClass]="isDarkMode ? 'bg-green-600 hover:bg-green-700 text-white focus:ring-green-500' : 'bg-green-600 hover:bg-green-700 text-white focus:ring-green-500'">
          Log In to Check Payment
        </button>
        
        <button 
          (click)="tryAgain()" 
          class="w-full py-3 px-4 rounded-lg font-medium transition-colors duration-200 focus:outline-none focus:ring-2 focus:ring-offset-2"
          [ngClass]="isDarkMode ? 'bg-indigo-600 hover:bg-indigo-700 text-white focus:ring-indigo-500' : 'bg-indigo-600 hover:bg-indigo-700 text-white focus:ring-indigo-500'">
          Return to Premium Plans
        </button>
      </div>
    </div>
    
    <div *ngIf="isLoading && status !== 'checking' && status !== 'pending'" class="absolute inset-0 flex items-center justify-center bg-black bg-opacity-50 rounded-lg">
      <div class="animate-spin rounded-full h-12 w-12 border-t-2 border-b-2 border-white"></div>
    </div>
    
  </div>
</div>
