<div class="min-h-screen p-4 transition-colors duration-200" [ngClass]="isDarkMode ? 'bg-gray-900' : 'bg-gray-50'">
  <div class="max-w-2xl mx-auto">
    <div class="rounded-lg shadow-lg p-6 sm:p-8 transition-colors duration-200" [ngClass]="isDarkMode ? 'bg-gray-800' : 'bg-white'">
      <div class="flex justify-between items-center mb-6">
        <h2 class="text-2xl font-bold transition-colors duration-200" [ngClass]="isDarkMode ? 'text-white' : 'text-gray-900'">
          Your Profile
        </h2>
        <button 
          (click)="signOut()" 
          class="px-3 py-1.5 text-sm font-medium rounded-md border transition-colors duration-200"
          [ngClass]="isDarkMode ? 'border-gray-600 text-gray-200 hover:bg-gray-700' : 'border-gray-300 text-gray-700 hover:bg-gray-50'"
        >
          Sign Out
        </button>
      </div>
      
      <div class="flex flex-col sm:flex-row gap-8 mb-6">
        <div class="flex flex-col items-center">
          <div class="w-24 h-24 rounded-full overflow-hidden bg-gray-200 mb-3">
            <ng-container *ngIf="profile?.picture; else avatarPlaceholder">
              <img [src]="profile?.picture" alt="Avatar" class="w-full h-full object-cover">
            </ng-container>
            <ng-template #avatarPlaceholder>
              <div class="w-full h-full flex items-center justify-center bg-indigo-600 text-white text-3xl font-semibold">
                {{ profile?.display_name ? profile?.display_name!.charAt(0).toUpperCase() : 'U' }}
              </div>
            </ng-template>
          </div>
        </div>
        
        <div class="flex-1">
          <div *ngIf="errorMessage" class="mb-4 p-3 rounded-md text-sm transition-colors duration-200" [ngClass]="isDarkMode ? 'bg-red-900/50 text-red-200' : 'bg-red-50 text-red-700'">
            {{ errorMessage }}
          </div>
          
          <div *ngIf="successMessage" class="mb-4 p-3 rounded-md text-sm transition-colors duration-200" [ngClass]="isDarkMode ? 'bg-green-900/50 text-green-200' : 'bg-green-50 text-green-700'">
            {{ successMessage }}
          </div>
          
          <div class="space-y-4">
            <div>
              <label class="block text-sm font-medium mb-1 transition-colors duration-200" [ngClass]="isDarkMode ? 'text-gray-200' : 'text-gray-700'">
                Email
              </label>
              <div class="w-full px-3 py-2 rounded-md shadow-sm text-sm transition-colors duration-200"
                [ngClass]="isDarkMode ? 'bg-gray-700 border-gray-600 text-white' : 'bg-gray-100 border-gray-300 text-gray-900'">
                {{ profile?.email || 'Not available' }}
              </div>
            </div>
            
            <div>
              <label class="block text-sm font-medium mb-1 transition-colors duration-200" [ngClass]="isDarkMode ? 'text-gray-200' : 'text-gray-700'">
                Display Name
              </label>
              <div class="w-full px-3 py-2 rounded-md shadow-sm text-sm transition-colors duration-200"
                [ngClass]="isDarkMode ? 'bg-gray-700 border-gray-600 text-white' : 'bg-gray-100 border-gray-300 text-gray-900'">
                {{ profile?.display_name || 'Not set' }}
              </div>
            </div>
            
            <div>
              <label class="block text-sm font-medium mb-1 transition-colors duration-200" [ngClass]="isDarkMode ? 'text-gray-200' : 'text-gray-700'">
                User ID
              </label>
              <div class="w-full px-3 py-2 rounded-md shadow-sm text-sm transition-colors duration-200"
                [ngClass]="isDarkMode ? 'bg-gray-700 border-gray-600 text-white' : 'bg-gray-100 border-gray-300 text-gray-900'">
                {{ profile?.id || 'Not available' }}
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
