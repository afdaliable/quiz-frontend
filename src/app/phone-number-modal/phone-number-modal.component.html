<div *ngIf="show" class="modal-overlay" [ngClass]="isDarkMode ? 'bg-gray-900 bg-opacity-75' : 'bg-black bg-opacity-50'">
  <div class="modal-container" [ngClass]="isDarkMode ? 'bg-gray-800 text-white' : 'bg-white text-gray-900'">
    <div class="modal-header">
      <h2 class="text-xl font-bold">Phone Number Required</h2>
    </div>
    
    <div class="modal-body">
      <p class="mb-4">Please enter your phone number to proceed with the payment.</p>
      
      <form [formGroup]="phoneForm" (ngSubmit)="onSubmit()">
        <div class="form-group">
          <label for="phoneNumber" class="block mb-2 font-medium">Phone Number:</label>
          <input 
            type="tel" 
            id="phoneNumber" 
            formControlName="phoneNumber" 
            placeholder="e.g., 081234567890" 
            class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2"
            [ngClass]="isDarkMode ? 'bg-gray-700 border-gray-600 focus:ring-indigo-500' : 'bg-white border-gray-300 focus:ring-indigo-500'"
          />
          
          <div *ngIf="phoneForm.get('phoneNumber')?.invalid && (phoneForm.get('phoneNumber')?.dirty || phoneForm.get('phoneNumber')?.touched)" class="mt-2 text-sm text-red-600">
            <div *ngIf="phoneForm.get('phoneNumber')?.errors?.['required']">Phone number is required.</div>
            <div *ngIf="phoneForm.get('phoneNumber')?.errors?.['minlength']">Phone number must be at least 10 digits.</div>
            <div *ngIf="phoneForm.get('phoneNumber')?.errors?.['maxlength']">Phone number cannot exceed 15 digits.</div>
            <div *ngIf="phoneForm.get('phoneNumber')?.errors?.['pattern']">Phone number must contain only digits.</div>
          </div>
          
          <small class="block mt-1 text-sm" [ngClass]="isDarkMode ? 'text-gray-400' : 'text-gray-600'">
            Please enter a valid phone number (10-15 digits)
          </small>
        </div>
        
        <div *ngIf="error" class="mt-4 p-3 rounded-lg bg-red-100 border border-red-200 text-red-700">
          {{ error }}
        </div>
        
        <div class="flex justify-end space-x-3 mt-6">
          <button 
            type="button" 
            (click)="onCancel()" 
            class="px-4 py-2 rounded-lg font-medium transition-colors duration-200"
            [ngClass]="isDarkMode ? 'bg-gray-700 text-white hover:bg-gray-600' : 'bg-gray-200 text-gray-700 hover:bg-gray-300'"
            [disabled]="isSubmitting"
          >
            Cancel
          </button>
          
          <button 
            type="submit" 
            class="px-4 py-2 rounded-lg font-medium transition-colors duration-200 focus:outline-none focus:ring-2 focus:ring-offset-2"
            [ngClass]="isDarkMode ? 'bg-indigo-600 hover:bg-indigo-700 text-white focus:ring-indigo-500' : 'bg-indigo-600 hover:bg-indigo-700 text-white focus:ring-indigo-500'"
            [disabled]="phoneForm.invalid || isSubmitting"
          >
            <span *ngIf="isSubmitting" class="inline-block mr-2">
              <svg class="animate-spin h-4 w-4 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
              </svg>
            </span>
            Submit
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
