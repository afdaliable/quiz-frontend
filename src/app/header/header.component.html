<header class="transition-colors duration-200" [ngClass]="isDarkMode ? 'bg-gray-800' : 'bg-white'">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex justify-between items-center h-16">
      <div class="flex items-center">
        <h1 class="text-xl font-bold" [ngClass]="isDarkMode ? 'text-white' : 'text-gray-900'">
          Quiz App
        </h1>
      </div>
      
      <div class="flex items-center space-x-4">
        <button
          (click)="toggleTheme()"
          class="p-2 rounded-lg transition-colors duration-200"
          [ngClass]="isDarkMode ? 'bg-gray-700 text-white' : 'bg-gray-100 text-gray-700'"
        >
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path *ngIf="!isDarkMode" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
              d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/>
            <path *ngIf="isDarkMode" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707"/>
          </svg>
        </button>

        <span class="text-sm" [ngClass]="isDarkMode ? 'text-gray-300' : 'text-gray-700'">
          {{ currentUser?.display_name }}
        </span>

        <button
          (click)="logout()"
          class="px-4 py-2 rounded-lg text-sm font-medium transition-colors duration-200"
          [ngClass]="isDarkMode ? 'bg-red-600 text-white hover:bg-red-700' : 'bg-red-600 text-white hover:bg-red-700'"
        >
          Logout
        </button>
      </div>
    </div>
  </div>
</header>
