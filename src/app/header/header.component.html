<header class="bg-white shadow-sm">
  <nav class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8" aria-label="Global">
    <div class="flex h-16 items-center justify-between">
      <!-- Logo -->
      <div class="flex lg:flex-1">
        <a href="#" class="-m-1.5 p-1.5">
          <span class="sr-only">Quiz App</span>
          <img class="h-8 w-auto" src="https://tailwindui.com/img/logos/mark.svg?color=indigo&shade=600" alt="">
        </a>
      </div>

      <!-- Mobile menu button -->
      <div class="flex lg:hidden">
        <button 
          type="button" 
          (click)="toggleMobileMenu()"
          class="inline-flex items-center justify-center rounded-md p-2.5 text-gray-700"
        >
          <span class="sr-only">{{ isMenuOpen ? 'Close menu' : 'Open menu' }}</span>
          <svg 
            class="h-6 w-6" 
            [class.hidden]="isMenuOpen"
            fill="none" 
            viewBox="0 0 24 24" 
            stroke="currentColor"
          >
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
          </svg>
          <svg 
            class="h-6 w-6" 
            [class.hidden]="!isMenuOpen"
            fill="none" 
            viewBox="0 0 24 24" 
            stroke="currentColor"
          >
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>

      <!-- Desktop menu -->
      <div class="hidden lg:flex lg:gap-x-8">
        <a routerLink="/home" class="text-sm font-semibold leading-6 text-gray-900">Home</a>
        <a routerLink="/daftar-soal" class="text-sm font-semibold leading-6 text-gray-900">Kumpulan Kuis</a>
        <a href="#" class="text-sm font-semibold leading-6 text-gray-900">Materi</a>
        <a href="#" class="text-sm font-semibold leading-6 text-gray-900">Hubungi Kami</a>
      </div>
    </div>

    <!-- Mobile menu -->
    <div 
      class="lg:hidden" 
      [class.hidden]="!isMenuOpen"
      id="mobile-menu"
    >
      <div class="space-y-1 px-2 pb-3 pt-2">
        <a routerLink="/home" class="block rounded-md px-3 py-2 text-base font-medium text-gray-900 hover:bg-gray-50">Home</a>
        <a routerLink="/daftar-soal" class="block rounded-md px-3 py-2 text-base font-medium text-gray-900 hover:bg-gray-50">Kumpulan Kuis</a>
        <a href="#" class="block rounded-md px-3 py-2 text-base font-medium text-gray-900 hover:bg-gray-50">Materi</a>
        <a href="#" class="block rounded-md px-3 py-2 text-base font-medium text-gray-900 hover:bg-gray-50">Hubungi Kami</a>
      </div>
    </div>
  </nav>
</header>
