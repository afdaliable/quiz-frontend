<header class="sticky top-0 z-50 border-b shadow-sm transition-colors duration-200"
  [ngClass]="isDarkMode ? 'bg-gray-900 border-gray-700' : 'bg-white border-gray-200'">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex justify-between items-center h-16">

      <!-- Brand -->
      <a routerLink="/home" class="flex items-center gap-2 group">
        <div class="w-8 h-8 rounded-lg bg-indigo-600 flex items-center justify-center shadow-sm group-hover:bg-indigo-700 transition-colors">
          <svg class="w-5 h-5 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4" />
          </svg>
        </div>
        <span class="text-xl font-bold tracking-tight transition-colors duration-200"
          [ngClass]="isDarkMode ? 'text-white' : 'text-gray-900'">
          QuizKu
        </span>
      </a>

      <!-- Right side -->
      <div class="flex items-center gap-2">

        <!-- Premium badge -->
        <a *ngIf="isLoggedIn() && isPremium" routerLink="/premium-plans"
          class="hidden sm:flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-semibold transition-all duration-200"
          [ngClass]="isDarkMode ? 'bg-amber-500/20 text-amber-400 hover:bg-amber-500/30' : 'bg-amber-50 text-amber-700 hover:bg-amber-100'">
          <svg class="w-3.5 h-3.5" fill="currentColor" viewBox="0 0 20 20">
            <path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z" />
          </svg>
          Premium
        </a>

        <!-- Dark mode toggle -->
        <button (click)="toggleTheme()"
          class="p-2 rounded-lg transition-colors duration-200"
          [ngClass]="isDarkMode ? 'text-gray-400 hover:text-white hover:bg-gray-800' : 'text-gray-500 hover:text-gray-900 hover:bg-gray-100'"
          aria-label="Toggle theme">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path *ngIf="!isDarkMode" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
            <path *ngIf="isDarkMode" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707" />
          </svg>
        </button>

        <!-- User avatar dropdown -->
        <div *ngIf="isLoggedIn()" class="relative user-menu-container">
          <button (click)="toggleUserMenu()"
            class="flex items-center gap-2 pl-2 pr-3 py-1.5 rounded-full transition-colors duration-200"
            [ngClass]="isDarkMode ? 'hover:bg-gray-800' : 'hover:bg-gray-100'">
            <div class="w-7 h-7 rounded-full bg-indigo-600 flex items-center justify-center text-white text-sm font-semibold">
              {{ (getUserName() || 'U').charAt(0).toUpperCase() }}
            </div>
            <span class="hidden sm:block text-sm font-medium transition-colors duration-200 max-w-[120px] truncate"
              [ngClass]="isDarkMode ? 'text-gray-300' : 'text-gray-700'">
              {{ getUserName() }}
            </span>
            <svg class="w-3.5 h-3.5 hidden sm:block transition-transform duration-200"
              [class.rotate-180]="showUserMenu"
              [ngClass]="isDarkMode ? 'text-gray-500' : 'text-gray-400'"
              fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
            </svg>
          </button>

          <!-- Dropdown menu -->
          <div *ngIf="showUserMenu"
            class="absolute right-0 mt-2 w-56 rounded-xl shadow-lg border py-1 z-50"
            [ngClass]="isDarkMode ? 'bg-gray-800 border-gray-700' : 'bg-white border-gray-100'">

            <a routerLink="/account" (click)="showUserMenu = false"
              class="flex items-center gap-2.5 px-4 py-2.5 text-sm transition-colors duration-150"
              [ngClass]="isDarkMode ? 'text-gray-300 hover:bg-gray-700' : 'text-gray-700 hover:bg-gray-50'">
              <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
              </svg>
              Akun Saya
            </a>

            <a routerLink="/history" (click)="showUserMenu = false"
              class="flex items-center gap-2.5 px-4 py-2.5 text-sm transition-colors duration-150"
              [ngClass]="isDarkMode ? 'text-gray-300 hover:bg-gray-700' : 'text-gray-700 hover:bg-gray-50'">
              <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01" />
              </svg>
              Riwayat Kuis
            </a>

            <!-- Bookmark Soal menu item (AFD-87) -->
            <a routerLink="/bookmarks" (click)="showUserMenu = false"
              class="flex items-center gap-2.5 px-4 py-2.5 transition-colors duration-150"
              [ngClass]="isDarkMode ? 'text-gray-300 hover:bg-gray-700' : 'text-gray-700 hover:bg-gray-50'">
              <svg class="w-4 h-4 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z"/>
              </svg>
              <div class="flex-1 min-w-0">
                <div class="flex items-center gap-2">
                  <span class="text-sm font-medium">Bookmark Soal</span>
                  <span *ngIf="bookmarkCount > 0"
                    class="px-1.5 py-0.5 rounded-full text-xs font-bold leading-none"
                    [ngClass]="isDarkMode ? 'bg-amber-500/20 text-amber-400' : 'bg-amber-100 text-amber-700'">
                    {{ bookmarkCount }}
                  </span>
                </div>
                <p class="text-xs mt-0.5 truncate"
                  [ngClass]="isDarkMode ? 'text-gray-500' : 'text-gray-400'">
                  Lihat soal yang sudah di-bookmark
                </p>
              </div>
            </a>

            <div class="border-t my-1" [ngClass]="isDarkMode ? 'border-gray-700' : 'border-gray-100'"></div>

            <button (click)="showUserMenu = false; logout()"
              class="w-full flex items-center gap-2.5 px-4 py-2.5 text-sm transition-colors duration-150"
              [ngClass]="isDarkMode ? 'text-gray-400 hover:bg-gray-700 hover:text-gray-200' : 'text-gray-500 hover:bg-gray-50 hover:text-gray-700'">
              <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
              </svg>
              Keluar
            </button>
          </div>
        </div>

        <!-- Login button (if not logged in) -->
        <button *ngIf="!isLoggedIn()" (click)="router.navigate([getButtonRoute()])"
          class="px-4 py-2 rounded-lg text-sm font-semibold bg-indigo-600 text-white hover:bg-indigo-700 transition-colors duration-200">
          Masuk
        </button>
      </div>
    </div>
  </div>
</header>
