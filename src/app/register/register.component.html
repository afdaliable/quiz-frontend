<div class="container mx-auto mt-10 p-4">
  <h2 class="text-2xl font-bold mb-4">Register</h2>
  <form (ngSubmit)="onSubmit()" #registerForm="ngForm" class="space-y-4">
    <div>
      <label for="display_name" class="block">Display Name</label>
      <input type="text" id="display_name" name="display_name" [(ngModel)]="registerData.display_name" required class="w-full p-2 border rounded">
    </div>
    <div>
      <label for="email" class="block">Email</label>
      <input type="email" id="email" name="email" [(ngModel)]="registerData.email" required class="w-full p-2 border rounded">
    </div>
    <div>
      <label for="password" class="block">Password</label>
      <input type="password" id="password" name="password" [(ngModel)]="registerData.password" required class="w-full p-2 border rounded">
    </div>
    <button type="submit" class="bg-blue-500 text-white p-2 rounded">Register</button>
  </form>
  <div *ngIf="errorMessage" class="text-red-500 mt-4">
    {{ errorMessage }}
  </div>
  <div *ngIf="showSuccessPopup" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center">
    <div class="bg-white p-8 rounded-lg shadow-lg">
      <h2 class="text-2xl font-bold mb-4">Pendaftaran Berhasil!</h2>
      <p>Anda akan dialihkan ke halaman utama.</p>
    </div>
  </div>
</div>
