<div class="flex items-center gap-3 mt-3">
  <span class="text-xs font-medium"
    [ngClass]="isDarkMode ? 'text-gray-400' : 'text-gray-500'">
    Soal ini:
  </span>

  <!-- 👍 Berguna -->
  <button (click)="vote('helpful')" [disabled]="loading"
    class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-semibold border transition-all duration-150 disabled:opacity-50"
    [ngClass]="isHelpful
      ? 'bg-green-500 border-green-500 text-white'
      : (isDarkMode
          ? 'bg-gray-700 border-gray-600 text-gray-300 hover:border-green-500 hover:text-green-400'
          : 'bg-white border-gray-200 text-gray-600 hover:border-green-400 hover:text-green-600')">
    👍 <span>{{ summary.helpful_count }}</span>
  </button>

  <!-- 👎 Membingungkan -->
  <button (click)="vote('confusing')" [disabled]="loading"
    class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-semibold border transition-all duration-150 disabled:opacity-50"
    [ngClass]="isConfusing
      ? 'bg-red-500 border-red-500 text-white'
      : (isDarkMode
          ? 'bg-gray-700 border-gray-600 text-gray-300 hover:border-red-500 hover:text-red-400'
          : 'bg-white border-gray-200 text-gray-600 hover:border-red-400 hover:text-red-600')">
    👎 <span>{{ summary.confusing_count }}</span>
  </button>
</div>
