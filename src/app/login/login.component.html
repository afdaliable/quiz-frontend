<div class="min-h-screen flex items-center justify-center p-4 transition-colors duration-200" [ngClass]="isDarkMode ? 'bg-gray-900' : 'bg-gray-50'">
  <div class="w-full max-w-md">
    <div class="rounded-lg shadow-lg p-6 sm:p-8 transition-colors duration-200" [ngClass]="isDarkMode ? 'bg-gray-800' : 'bg-white'">
      <h2 class="text-2xl font-bold mb-6 text-center transition-colors duration-200" [ngClass]="isDarkMode ? 'text-white' : 'text-gray-900'">
        Welcome to Quiz App
      </h2>
      
      <!-- Error Message -->
      <div *ngIf="errorMessage" class="mb-4 p-3 rounded-md text-sm" [ngClass]="isDarkMode ? 'bg-red-900/50 text-red-200' : 'bg-red-50 text-red-700'">
        {{ errorMessage }}
      </div>
      
      <!-- Google Sign In Button -->
      <button 
        (click)="signInWithGoogle()" 
        [disabled]="loading"
        class="w-full flex items-center justify-center gap-3 py-2.5 px-4 rounded-md shadow-sm text-sm font-medium transition-colors duration-200"
        [ngClass]="isDarkMode ? 
          'bg-gray-700 hover:bg-gray-600 text-white border border-gray-600' : 
          'bg-white hover:bg-gray-50 text-gray-700 border border-gray-300'"
      >
        <!-- Google Icon -->
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 48 48">
          <path fill="#FFC107" d="M43.611,20.083H42V20H24v8h11.303c-1.649,4.657-6.08,8-11.303,8c-6.627,0-12-5.373-12-12c0-6.627,5.373-12,12-12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C12.955,4,4,12.955,4,24c0,11.045,8.955,20,20,20c11.045,0,20-8.955,20-20C44,22.659,43.862,21.35,43.611,20.083z"></path>
          <path fill="#FF3D00" d="M6.306,14.691l6.571,4.819C14.655,15.108,18.961,12,24,12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C16.318,4,9.656,8.337,6.306,14.691z"></path>
          <path fill="#4CAF50" d="M24,44c5.166,0,9.86-1.977,13.409-5.192l-6.19-5.238C29.211,35.091,26.715,36,24,36c-5.202,0-9.619-3.317-11.283-7.946l-6.522,5.025C9.505,39.556,16.227,44,24,44z"></path>
          <path fill="#1976D2" d="M43.611,20.083H42V20H24v8h11.303c-0.792,2.237-2.231,4.166-4.087,5.571c0.001-0.001,0.002-0.001,0.003-0.002l6.19,5.238C36.971,39.205,44,34,44,24C44,22.659,43.862,21.35,43.611,20.083z"></path>
        </svg>
        <span>Continue with Google</span>
        
        <!-- Loading Spinner -->
        <div *ngIf="loading" class="ml-2 animate-spin h-4 w-4 border-2 rounded-full" [ngClass]="isDarkMode ? 'border-white border-t-transparent' : 'border-gray-700 border-t-transparent'"></div>
      </button>
      
      <div class="mt-6 text-center text-sm" [ngClass]="isDarkMode ? 'text-gray-400' : 'text-gray-600'">
        By continuing, you agree to our Terms of Service and Privacy Policy
      </div>
    </div>
  </div>
</div>
