<div class="min-h-screen flex items-center justify-center transition-colors duration-200" [ngClass]="isDarkMode ? 'bg-gray-900' : 'bg-gray-50'">
  <div class="max-w-md w-full mx-4">
    <div class="rounded-lg shadow-lg p-6 sm:p-8 transition-colors duration-200" [ngClass]="isDarkMode ? 'bg-gray-800' : 'bg-white'">
      <h2 class="text-2xl font-bold mb-6 text-center" [ngClass]="isDarkMode ? 'text-white' : 'text-gray-900'">
        Login
      </h2>
      
      <form (ngSubmit)="onSubmit()" #loginForm="ngForm" class="space-y-4">
        <div>
          <label for="email" class="block text-sm font-medium" [ngClass]="isDarkMode ? 'text-gray-200' : 'text-gray-700'">
            Email address
          </label>
          <div class="mt-1">
            <input
              id="email"
              name="email"
              type="email"
              required
              [(ngModel)]="loginData.email"
              class="appearance-none block w-full px-3 py-2 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm transition-colors duration-200"
              [ngClass]="isDarkMode ? 'bg-gray-700 border-gray-600 text-white' : 'bg-white border-gray-300 text-gray-900'"
            />
          </div>
        </div>

        <div>
          <label for="password" class="block text-sm font-medium" [ngClass]="isDarkMode ? 'text-gray-200' : 'text-gray-700'">
            Password
          </label>
          <div class="mt-1">
            <input
              id="password"
              name="password"
              type="password"
              required
              [(ngModel)]="loginData.password"
              class="appearance-none block w-full px-3 py-2 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm transition-colors duration-200"
              [ngClass]="isDarkMode ? 'bg-gray-700 border-gray-600 text-white' : 'bg-white border-gray-300 text-gray-900'"
            />
          </div>
        </div>

        <div *ngIf="errorMessage" class="text-red-600 text-sm">
          {{ errorMessage }}
        </div>

        <div>
          <button
            type="submit"
            class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500"
          >
            Sign in
          </button>
        </div>
      </form>

      <div class="mt-4 text-center" [ngClass]="isDarkMode ? 'text-gray-300' : 'text-gray-600'">
        Don't have an account? 
        <a routerLink="/register" class="text-indigo-600 hover:text-indigo-500">Register</a>
      </div>
    </div>
  </div>
</div>
