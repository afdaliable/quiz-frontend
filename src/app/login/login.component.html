<div class="min-h-screen flex items-center justify-center p-4 transition-colors duration-200" [ngClass]="isDarkMode ? 'bg-gray-900' : 'bg-gray-50'">
  <div class="w-full max-w-md">
    <div class="rounded-lg shadow-lg p-6 sm:p-8 transition-colors duration-200" [ngClass]="isDarkMode ? 'bg-gray-800' : 'bg-white'">
      <h2 class="text-2xl font-bold mb-6 text-center transition-colors duration-200" [ngClass]="isDarkMode ? 'text-white' : 'text-gray-900'">
        Login to Your Account
      </h2>
      
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-4">
        <!-- Email Input -->
        <div>
          <label for="email" class="block text-sm font-medium mb-1 transition-colors duration-200" [ngClass]="isDarkMode ? 'text-gray-200' : 'text-gray-700'">
            Email
          </label>
          <input
            id="email"
            type="email"
            formControlName="email"
            class="w-full px-3 py-2 rounded-md shadow-sm text-sm transition-colors duration-200"
            [ngClass]="isDarkMode ? 'bg-gray-700 border-gray-600 text-white placeholder-gray-400' : 'bg-white border-gray-300 text-gray-900 placeholder-gray-500'"
            placeholder="Enter your email"
          />
          <div *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched" class="mt-1 text-sm text-red-600">
            <span *ngIf="loginForm.get('email')?.errors?.['required']">Email is required</span>
            <span *ngIf="loginForm.get('email')?.errors?.['email']">Please enter a valid email</span>
          </div>
        </div>
        
        <!-- Password Input -->
        <div>
          <label for="password" class="block text-sm font-medium mb-1 transition-colors duration-200" [ngClass]="isDarkMode ? 'text-gray-200' : 'text-gray-700'">
            Password
          </label>
          <div class="relative">
            <input
              [type]="showPassword ? 'text' : 'password'"
              id="password"
              formControlName="password"
              class="w-full px-3 py-2 rounded-md shadow-sm text-sm transition-colors duration-200"
              [ngClass]="isDarkMode ? 'bg-gray-700 border-gray-600 text-white placeholder-gray-400' : 'bg-white border-gray-300 text-gray-900 placeholder-gray-500'"
              placeholder="Enter your password"
            />
            <button 
              type="button" 
              class="absolute inset-y-0 right-0 pr-3 flex items-center text-sm leading-5 transition-colors duration-200"
              [ngClass]="isDarkMode ? 'text-gray-400 hover:text-gray-300' : 'text-gray-500 hover:text-gray-700'"
              (click)="togglePasswordVisibility()"
            >
              <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor" *ngIf="!showPassword">
                <path d="M10 12a2 2 0 100-4 2 2 0 000 4z" />
                <path fill-rule="evenodd" d="M.458 10C1.732 5.943 5.522 3 10 3s8.268 2.943 9.542 7c-1.274 4.057-5.064 7-9.542 7S1.732 14.057.458 10zM14 10a4 4 0 11-8 0 4 4 0 018 0z" clip-rule="evenodd" />
              </svg>
              <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor" *ngIf="showPassword">
                <path fill-rule="evenodd" d="M3.707 2.293a1 1 0 00-1.414 1.414l14 14a1 1 0 001.414-1.414l-1.473-1.473A10.014 10.014 0 0019.542 10C18.268 5.943 14.478 3 10 3a9.958 9.958 0 00-4.512 1.074l-1.78-1.781zm4.261 4.26l1.514 1.515a2.003 2.003 0 012.45 2.45l1.514 1.514a4 4 0 00-5.478-5.478z" clip-rule="evenodd" />
                <path d="M12.454 16.697L9.75 13.992a4 4 0 01-3.742-3.741L2.335 6.578A9.98 9.98 0 00.458 10c1.274 4.057 5.065 7 9.542 7 .847 0 1.669-.105 2.454-.303z" />
              </svg>
            </button>
          </div>
          <div *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched" class="mt-1 text-sm text-red-600">
            <span *ngIf="loginForm.get('password')?.errors?.['required']">Password is required</span>
            <span *ngIf="loginForm.get('password')?.errors?.['minlength']">Password must be at least 6 characters</span>
          </div>
        </div>
        
        <!-- Remember Me Checkbox -->
        <div class="flex items-center">
          <input
            id="rememberMe"
            type="checkbox"
            formControlName="rememberMe"
            class="h-4 w-4 rounded border-gray-300 text-indigo-600 focus:ring-indigo-500 transition-colors duration-200"
            [ngClass]="isDarkMode ? 'bg-gray-700 border-gray-600' : 'bg-white border-gray-300'"
          />
          <label for="rememberMe" class="ml-2 block text-sm transition-colors duration-200" [ngClass]="isDarkMode ? 'text-gray-200' : 'text-gray-700'">
            Remember me
          </label>
        </div>
        
        <!-- Error Message -->
        <div *ngIf="errorMessage" class="p-3 rounded-md text-sm transition-colors duration-200" [ngClass]="isDarkMode ? 'bg-red-900/50 text-red-200' : 'bg-red-50 text-red-700'">
          {{ errorMessage }}
        </div>
        
        <!-- Login Button -->
        <div>
          <button
            type="submit"
            [disabled]="loading || loginForm.invalid"
            class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition-colors duration-200 disabled:opacity-50 disabled:cursor-not-allowed"
            [ngClass]="isDarkMode ? 'focus:ring-offset-gray-800' : ''"
          >
            <svg *ngIf="loading" class="animate-spin -ml-1 mr-2 h-4 w-4 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            {{ loading ? 'Logging in...' : 'Login' }}
          </button>
        </div>
        
        <!-- Divider -->
        <div class="relative my-4">
          <div class="absolute inset-0 flex items-center">
            <div class="w-full border-t transition-colors duration-200" [ngClass]="isDarkMode ? 'border-gray-700' : 'border-gray-300'"></div>
          </div>
          <div class="relative flex justify-center text-sm">
            <span class="px-2 transition-colors duration-200" [ngClass]="isDarkMode ? 'bg-gray-800 text-gray-400' : 'bg-white text-gray-500'">OR</span>
          </div>
        </div>
        
        <!-- Magic Link Button -->
        <div>
          <button
            type="button"
            (click)="signInWithMagicLink()"
            [disabled]="loading || loginForm.get('email')?.invalid"
            class="w-full flex justify-center py-2 px-4 border rounded-md shadow-sm text-sm font-medium transition-colors duration-200 disabled:opacity-50 disabled:cursor-not-allowed"
            [ngClass]="isDarkMode ? 'border-gray-600 text-gray-200 hover:bg-gray-700' : 'border-gray-300 text-gray-700 hover:bg-gray-50'"
          >
            Login with Magic Link
          </button>
        </div>
      </form>
      
      <!-- Register Link -->
      <div class="mt-6 text-center text-sm transition-colors duration-200" [ngClass]="isDarkMode ? 'text-gray-300' : 'text-gray-600'">
        Don't have an account? 
        <a routerLink="/register" class="font-medium transition-colors duration-200" [ngClass]="isDarkMode ? 'text-indigo-400 hover:text-indigo-300' : 'text-indigo-600 hover:text-indigo-500'">
          Sign up
        </a>
      </div>
    </div>
  </div>
</div>
