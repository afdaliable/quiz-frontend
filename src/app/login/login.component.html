<div class="container mx-auto mt-10 p-4">
    <h2 class="text-2xl font-bold mb-4">Login</h2>
    <form (ngSubmit)="onSubmit()" #loginForm="ngForm" class="space-y-4">
      <div>
        <label for="email" class="block">Email</label>
        <input type="email" id="email" name="email" [(ngModel)]="loginData.email" required class="w-full p-2 border rounded">
      </div>
      <div>
        <label for="password" class="block">Password</label>
        <input type="password" id="password" name="password" [(ngModel)]="loginData.password" required class="w-full p-2 border rounded">
      </div>
      <button type="submit" class="bg-green-500 text-white p-2 rounded">Login</button>
      <div *ngIf="errorMessage" class="text-red-500 mt-2">{{ errorMessage }}</div>
    </form>
  </div>
