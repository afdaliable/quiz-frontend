<!-- Global navigation progress bar -->
<div *ngIf="isNavigating"
  class="fixed top-0 left-0 right-0 z-[100] h-0.5 bg-indigo-200 overflow-hidden">
  <div class="h-full bg-indigo-600 animate-progress-bar"></div>
</div>

<app-header></app-header>
<router-outlet></router-outlet>

<!-- Session Invalid Modal -->
<div *ngIf="showSessionInvalidModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
  <div class="bg-white rounded-lg p-6 max-w-md w-full">
    <div class="flex items-center justify-center mb-4 text-red-500">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-12 w-12" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
      </svg>
    </div>
    <h2 class="text-xl font-bold mb-4 text-center">Session Expired</h2>
    <p class="mb-6 text-gray-700">Your session is no longer valid. This may be because:</p>
    <ul class="list-disc pl-8 mb-6 text-gray-700">
      <li>You logged in from another device</li>
      <li>Your session has expired</li>
      <li>Your account credentials have changed</li>
    </ul>
    <p class="mb-6 text-gray-700">For security reasons, only one active session is allowed at a time.</p>
    <div class="flex justify-center">
      <button (click)="closeSessionInvalidModal()" class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700 transition-colors">
        Go to Login
      </button>
    </div>
  </div>
</div>
