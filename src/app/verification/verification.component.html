<!-- src/app/verification/verification.component.html -->
<div class="min-h-screen flex items-center justify-center transition-colors duration-200" [ngClass]="isDarkMode ? 'bg-gray-900' : 'bg-gray-50'">
    <div class="max-w-md w-full mx-4">
      <div class="rounded-lg shadow-lg p-6 sm:p-8 transition-colors duration-200" [ngClass]="isDarkMode ? 'bg-gray-800' : 'bg-white'">
        <div class="text-center">
          <svg class="mx-auto h-12 w-12 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path>
          </svg>
          
          <h2 class="mt-4 text-2xl font-bold" [ngClass]="isDarkMode ? 'text-white' : 'text-gray-900'">
            Check your email
          </h2>
          
          <p class="mt-2" [ngClass]="isDarkMode ? 'text-gray-300' : 'text-gray-600'">
            We've sent a verification link to<br>
            <span class="font-medium">{{ email }}</span>
          </p>
          
          <p class="mt-4" [ngClass]="isDarkMode ? 'text-gray-300' : 'text-gray-600'">
            Click the link in the email to verify your account and complete the registration process.
          </p>
          
          <div class="mt-6">
            <a routerLink="/login" class="inline-block px-4 py-2 rounded-lg text-sm font-medium transition-colors duration-200" [ngClass]="isDarkMode ? 'bg-indigo-600 text-white hover:bg-indigo-700' : 'bg-indigo-600 text-white hover:bg-indigo-700'">
              Back to Login
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>
