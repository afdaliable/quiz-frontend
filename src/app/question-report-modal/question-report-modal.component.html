<!-- Backdrop -->
<div class="fixed inset-0 z-50 flex items-center justify-center px-4"
  (click)="close()">
  <div class="absolute inset-0 bg-black/50"></div>

  <div class="relative w-full max-w-sm rounded-2xl shadow-2xl p-6 z-10"
    [ngClass]="isDarkMode ? 'bg-gray-800' : 'bg-white'"
    (click)="$event.stopPropagation()">

    <!-- Success state -->
    <div *ngIf="submitted" class="text-center py-4">
      <div class="text-4xl mb-3">✅</div>
      <p class="font-semibold" [ngClass]="isDarkMode ? 'text-white' : 'text-gray-900'">
        Laporan terkirim!
      </p>
      <p class="text-sm mt-1" [ngClass]="isDarkMode ? 'text-gray-400' : 'text-gray-500'">
        Terima kasih. Admin akan meninjau soal ini.
      </p>
    </div>

    <!-- Form state -->
    <ng-container *ngIf="!submitted">
      <h3 class="text-base font-bold mb-4"
        [ngClass]="isDarkMode ? 'text-white' : 'text-gray-900'">
        🚩 Laporkan Soal
      </h3>

      <!-- Pilih alasan -->
      <div class="space-y-2 mb-4">
        <button *ngFor="let r of reasons"
          (click)="selectedReason = r.value"
          class="w-full text-left px-3 py-2.5 rounded-xl text-sm border transition-all duration-150"
          [ngClass]="selectedReason === r.value
            ? (isDarkMode ? 'border-indigo-500 bg-indigo-900/20 text-indigo-300' : 'border-indigo-500 bg-indigo-50 text-indigo-700')
            : (isDarkMode ? 'border-gray-600 bg-gray-700/50 text-gray-300 hover:border-gray-500' : 'border-gray-200 bg-gray-50 text-gray-700 hover:border-gray-300')">
          {{ r.label }}
        </button>
      </div>

      <!-- Detail opsional -->
      <textarea [(ngModel)]="detail" rows="2" maxlength="500"
        placeholder="Keterangan tambahan (opsional)"
        class="w-full rounded-xl px-3 py-2 text-sm border mb-1 resize-none focus:outline-none focus:ring-2 focus:ring-indigo-400"
        [ngClass]="isDarkMode ? 'bg-gray-700 border-gray-600 text-white placeholder-gray-500' : 'bg-gray-50 border-gray-300 text-gray-900 placeholder-gray-400'">
      </textarea>
      <p class="text-xs text-right mb-4"
        [ngClass]="isDarkMode ? 'text-gray-500' : 'text-gray-400'">
        {{ detail.length }}/500
      </p>

      <!-- Error -->
      <p *ngIf="error" class="text-xs text-red-500 mb-3">{{ error }}</p>

      <!-- Actions -->
      <div class="flex gap-3">
        <button (click)="close()"
          class="flex-1 py-2.5 rounded-xl text-sm font-semibold transition-colors"
          [ngClass]="isDarkMode ? 'bg-gray-700 text-gray-300 hover:bg-gray-600' : 'bg-gray-100 text-gray-600 hover:bg-gray-200'">
          Batal
        </button>
        <button (click)="submit()"
          [disabled]="!selectedReason || submitting"
          class="flex-1 py-2.5 rounded-xl text-sm font-bold text-white transition-colors disabled:opacity-50 disabled:cursor-not-allowed bg-indigo-600 hover:bg-indigo-700">
          {{ submitting ? 'Mengirim...' : 'Kirim Laporan' }}
        </button>
      </div>
    </ng-container>
  </div>
</div>
