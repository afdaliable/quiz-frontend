<div
  class="min-h-screen pb-24 transition-colors duration-200"
  [ngClass]="isDarkMode ? 'bg-gray-950 text-gray-100' : 'bg-gray-50 text-gray-900'"
>
  <!-- Header -->
  <div
    class="sticky top-0 z-10 border-b px-4 py-3 transition-colors duration-200"
    [ngClass]="isDarkMode ? 'bg-gray-900 border-gray-800' : 'bg-white border-gray-200'"
  >
    <div class="max-w-2xl mx-auto">
      <h1 class="text-lg font-bold mb-1">Jalur Ujian</h1>
      <app-breadcrumb [items]="breadcrumbs"></app-breadcrumb>
    </div>
  </div>

  <!-- Loading -->
  <div *ngIf="isLoading" class="flex justify-center items-center h-64">
    <div class="w-8 h-8 border-4 border-indigo-500 border-t-transparent rounded-full animate-spin"></div>
  </div>

  <div *ngIf="!isLoading" class="max-w-2xl mx-auto px-4 py-6">

    <!-- VIEW 1: Track List -->
    <ng-container *ngIf="view === 'tracks'">
      <p class="text-sm mb-4" [ngClass]="isDarkMode ? 'text-gray-400' : 'text-gray-500'">
        Pilih jalur ujian yang ingin kamu pelajari
      </p>

      <!-- Live tracks -->
      <div class="grid grid-cols-2 sm:grid-cols-3 gap-3 mb-6" *ngIf="liveTracks.length > 0">
        <button
          *ngFor="let track of liveTracks"
          type="button"
          (click)="selectTrack(track)"
          class="rounded-xl p-4 text-left border transition-all duration-150 group hover:border-indigo-400 hover:shadow-md focus:outline-none"
          [ngClass]="isDarkMode
            ? 'bg-gray-800 border-gray-700 hover:bg-gray-750'
            : 'bg-white border-gray-200 hover:bg-indigo-50'"
        >
          <div class="text-2xl mb-2">{{ track.icon || '📋' }}</div>
          <div class="font-semibold text-sm leading-tight group-hover:text-indigo-600" [ngClass]="isDarkMode ? 'group-hover:text-indigo-400' : ''">
            {{ track.name }}
          </div>
          <div class="mt-1">
            <span class="text-xs px-1.5 py-0.5 rounded-full bg-green-100 text-green-700 font-medium">
              Live
            </span>
          </div>
        </button>
      </div>

      <!-- Upcoming tracks -->
      <div *ngIf="upcomingTracks.length > 0">
        <h2 class="text-xs font-semibold uppercase tracking-wide mb-3" [ngClass]="isDarkMode ? 'text-gray-500' : 'text-gray-400'">
          Segera Hadir
        </h2>
        <div class="grid grid-cols-2 sm:grid-cols-3 gap-3">
          <div
            *ngFor="let track of upcomingTracks"
            class="rounded-xl p-4 border opacity-50 cursor-not-allowed"
            [ngClass]="isDarkMode ? 'bg-gray-800 border-gray-700' : 'bg-white border-gray-200'"
          >
            <div class="text-2xl mb-2">{{ track.icon || '📋' }}</div>
            <div class="font-semibold text-sm leading-tight">{{ track.name }}</div>
            <div class="mt-1">
              <span class="text-xs px-1.5 py-0.5 rounded-full bg-gray-100 text-gray-500 font-medium">
                {{ track.upcoming_label || 'Coming Soon' }}
              </span>
            </div>
          </div>
        </div>
      </div>
    </ng-container>

    <!-- VIEW 2: Category List -->
    <ng-container *ngIf="view === 'categories' && activeTrack">
      <!-- Latihan semua button -->
      <button
        type="button"
        (click)="startBrowse({ track_slug: activeTrack.slug })"
        class="w-full mb-5 py-3 rounded-xl font-semibold text-white bg-indigo-600 hover:bg-indigo-700 transition-colors"
      >
        Latihan Semua {{ activeTrack.name }}
      </button>

      <p class="text-sm mb-4" [ngClass]="isDarkMode ? 'text-gray-400' : 'text-gray-500'">
        Pilih kategori ujian
      </p>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
        <button
          *ngFor="let category of activeTrack.categories"
          type="button"
          (click)="selectCategory(activeTrack.slug, category.slug)"
          class="rounded-xl p-4 text-left border transition-all duration-150 hover:border-indigo-400 hover:shadow-md focus:outline-none"
          [ngClass]="isDarkMode
            ? 'bg-gray-800 border-gray-700 hover:bg-gray-750'
            : 'bg-white border-gray-200 hover:bg-indigo-50'"
        >
          <div class="font-semibold text-sm">{{ category.name }}</div>
          <div class="text-xs mt-1" [ngClass]="isDarkMode ? 'text-gray-400' : 'text-gray-500'">
            {{ subcategoryCount(category) }} subkategori
          </div>
        </button>
      </div>

      <div *ngIf="activeTrack.categories.length === 0" class="text-center py-12 text-sm" [ngClass]="isDarkMode ? 'text-gray-500' : 'text-gray-400'">
        Belum ada kategori tersedia
      </div>
    </ng-container>

    <!-- VIEW 3: Subcategory + Topics -->
    <ng-container *ngIf="view === 'subcategories' && activeTrack && activeCategory">
      <!-- Latihan semua kategori -->
      <button
        type="button"
        (click)="startBrowse({ track_slug: activeTrack.slug, category_slug: activeCategory.slug })"
        class="w-full mb-5 py-3 rounded-xl font-semibold text-white bg-indigo-600 hover:bg-indigo-700 transition-colors"
      >
        Latihan Semua {{ activeCategory.name }}
      </button>

      <!-- Subcategory accordions -->
      <div class="space-y-2">
        <div
          *ngFor="let sub of activeCategory.subcategories"
          class="rounded-xl border overflow-hidden transition-all"
          [ngClass]="isDarkMode ? 'bg-gray-800 border-gray-700' : 'bg-white border-gray-200'"
        >
          <!-- Accordion header -->
          <button
            type="button"
            (click)="toggleSubcategory(sub.id)"
            class="w-full flex items-center justify-between px-4 py-3 text-left focus:outline-none"
            [ngClass]="isDarkMode ? 'hover:bg-gray-750' : 'hover:bg-gray-50'"
          >
            <span class="font-semibold text-sm">{{ sub.name }}</span>
            <span class="ml-2 flex items-center gap-1 text-xs" [ngClass]="isDarkMode ? 'text-gray-400' : 'text-gray-500'">
              <span>{{ sub.topics ? sub.topics.length : 0 }} topik</span>
              <svg
                xmlns="http://www.w3.org/2000/svg"
                fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"
                class="w-4 h-4 transition-transform duration-200"
                [class.rotate-180]="isSubcategoryExpanded(sub.id)"
              >
                <path stroke-linecap="round" stroke-linejoin="round" d="m19.5 8.25-7.5 7.5-7.5-7.5" />
              </svg>
            </span>
          </button>

          <!-- Topics -->
          <div *ngIf="isSubcategoryExpanded(sub.id)" class="px-4 pb-4 pt-1">
            <button
              type="button"
              (click)="startBrowse({ track_slug: activeTrack.slug, subcategory_slug: sub.slug })"
              class="mb-3 text-xs font-medium text-indigo-600 hover:text-indigo-700"
              [ngClass]="isDarkMode ? 'text-indigo-400 hover:text-indigo-300' : ''"
            >
              Latihan semua {{ sub.name }} →
            </button>

            <div class="flex flex-wrap gap-2">
              <button
                *ngFor="let topic of sub.topics"
                type="button"
                (click)="startBrowse({ track_slug: activeTrack.slug, subcategory_slug: sub.slug, topic_slug: topic.slug })"
                class="px-3 py-1.5 rounded-full text-xs font-medium border transition-colors hover:bg-indigo-600 hover:text-white hover:border-indigo-600"
                [ngClass]="isDarkMode
                  ? 'bg-gray-700 border-gray-600 text-gray-200'
                  : 'bg-gray-100 border-gray-200 text-gray-700'"
              >
                {{ topic.name }}
              </button>
            </div>

            <div *ngIf="!sub.topics || sub.topics.length === 0" class="text-xs" [ngClass]="isDarkMode ? 'text-gray-500' : 'text-gray-400'">
              Belum ada topik
            </div>
          </div>
        </div>
      </div>

      <div *ngIf="activeCategory.subcategories.length === 0" class="text-center py-12 text-sm" [ngClass]="isDarkMode ? 'text-gray-500' : 'text-gray-400'">
        Belum ada subkategori tersedia
      </div>
    </ng-container>

  </div>
</div>
