<div
  class="min-h-screen flex items-center justify-center px-4 transition-colors duration-200"
  [ngClass]="isDarkMode ? 'bg-gray-900' : 'bg-gray-100'"
>
  <div class="w-full max-w-lg">
    <!-- Card -->
    <div
      class="rounded-2xl shadow-xl overflow-hidden transition-colors duration-200"
      [ngClass]="isDarkMode ? 'bg-gray-800' : 'bg-white'"
    >
      <!-- Header: Paket info with category color -->
      <div class="px-6 pt-6 pb-4" [ngClass]="categoryHeaderClass">
        <!-- Back button -->
        <button
          type="button"
          (click)="goBack()"
          class="inline-flex items-center gap-1 text-sm font-medium mb-3 opacity-80 hover:opacity-100 transition-opacity text-white"
        >
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
          </svg>
          Pilih Paket Lain
        </button>

        <div class="flex items-start gap-3">
          <!-- Category icon -->
          <div class="flex-shrink-0 w-10 h-10 rounded-xl bg-white/20 flex items-center justify-center text-xl">
            {{ categoryIcon }}
          </div>
          <div class="min-w-0">
            <p class="text-xs font-semibold uppercase tracking-wider text-white/70">
              {{ selectedPaket?.kategori_soal || '—' }}
            </p>
            <h1 class="text-lg font-bold text-white leading-snug">
              {{ selectedPaket?.nama_paket_soal || 'Memuat...' }}
            </h1>
          </div>
        </div>

        <!-- Compact info row -->
        <div *ngIf="selectedPaket" class="mt-4 flex items-center gap-4 text-white/90 text-sm">
          <span class="flex items-center gap-1">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A2 2 0 013 12V7a2 2 0 012-2z"/>
            </svg>
            {{ selectedPaket.kategori_soal }}
          </span>
          <span class="text-white/40">|</span>
          <span class="flex items-center gap-1">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
            </svg>
            {{ selectedPaket.jumlah_soal }} soal
          </span>
          <span class="text-white/40">|</span>
          <span class="flex items-center gap-1">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>
            </svg>
            ±{{ estimasiDetikPerSoal }} dtk/soal
          </span>
        </div>
      </div>

      <!-- Form body -->
      <form (ngSubmit)="startQuiz()" #quizForm="ngForm" class="px-6 py-5 space-y-5">

        <!-- User info -->
        <div *ngIf="user" class="flex items-center gap-3">
          <div
            class="w-8 h-8 rounded-full flex items-center justify-center text-sm font-bold text-white"
            [ngClass]="categoryHeaderClass"
          >
            {{ userInitial }}
          </div>
          <span class="text-sm font-medium" [ngClass]="isDarkMode ? 'text-gray-200' : 'text-gray-700'">
            {{ user.display_name }}
          </span>
        </div>

        <!-- Duration Selection (only in exam mode) -->
        <div *ngIf="quizMode === 'exam'">
          <label
            class="block text-sm font-semibold mb-1.5"
            [ngClass]="isDarkMode ? 'text-gray-200' : 'text-gray-700'"
          >
            Durasi
          </label>
          <select
            name="durasi"
            [(ngModel)]="selectedDurasi"
            (ngModelChange)="onDurasiChange()"
            required
            class="block w-full rounded-lg px-3 py-2.5 text-sm border focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-colors duration-200"
            [ngClass]="isDarkMode
              ? 'bg-gray-700 text-white border-gray-600'
              : 'bg-gray-50 text-gray-900 border-gray-300'"
          >
            <option *ngFor="let durasi of durasiOptions" [value]="durasi">{{ durasi }} menit</option>
          </select>
        </div>

        <!-- Quiz Mode Selection -->
        <div>
          <label class="block text-sm font-semibold mb-2"
            [ngClass]="isDarkMode ? 'text-gray-200' : 'text-gray-700'">
            Mode
          </label>
          <div class="space-y-2">
            <!-- Exam Mode -->
            <label
              class="flex items-center gap-3 rounded-xl p-3 transition-all duration-200 cursor-pointer border-2"
              [ngClass]="quizMode === 'exam'
                ? (isDarkMode ? 'bg-indigo-900/30 border-indigo-500' : 'bg-indigo-50 border-indigo-500')
                : (isDarkMode ? 'bg-gray-700/60 border-transparent hover:border-gray-600' : 'bg-gray-50 border-transparent hover:border-gray-300')"
            >
              <input type="radio" [(ngModel)]="quizMode" value="exam" name="quizMode" class="sr-only">
              <div class="flex-shrink-0 w-5 h-5 rounded-full border-2 flex items-center justify-center transition-colors"
                [ngClass]="quizMode === 'exam'
                  ? 'border-indigo-500'
                  : (isDarkMode ? 'border-gray-500' : 'border-gray-300')">
                <div *ngIf="quizMode === 'exam'" class="w-2.5 h-2.5 rounded-full bg-indigo-500"></div>
              </div>
              <div>
                <p class="text-sm font-semibold" [ngClass]="isDarkMode ? 'text-gray-100' : 'text-gray-800'">
                  Mode Ujian
                </p>
                <p class="text-xs mt-0.5" [ngClass]="isDarkMode ? 'text-gray-400' : 'text-gray-500'">
                  Ada timer, skor dihitung ke history
                </p>
              </div>
            </label>

            <!-- Study Mode -->
            <label
              class="flex items-center gap-3 rounded-xl p-3 transition-all duration-200 cursor-pointer border-2"
              [ngClass]="quizMode === 'study'
                ? (isDarkMode ? 'bg-emerald-900/30 border-emerald-500' : 'bg-emerald-50 border-emerald-500')
                : (isDarkMode ? 'bg-gray-700/60 border-transparent hover:border-gray-600' : 'bg-gray-50 border-transparent hover:border-gray-300')"
            >
              <input type="radio" [(ngModel)]="quizMode" value="study" name="quizMode" class="sr-only">
              <div class="flex-shrink-0 w-5 h-5 rounded-full border-2 flex items-center justify-center transition-colors"
                [ngClass]="quizMode === 'study'
                  ? 'border-emerald-500'
                  : (isDarkMode ? 'border-gray-500' : 'border-gray-300')">
                <div *ngIf="quizMode === 'study'" class="w-2.5 h-2.5 rounded-full bg-emerald-500"></div>
              </div>
              <div>
                <p class="text-sm font-semibold" [ngClass]="isDarkMode ? 'text-gray-100' : 'text-gray-800'">
                  Mode Belajar
                </p>
                <p class="text-xs mt-0.5" [ngClass]="isDarkMode ? 'text-gray-400' : 'text-gray-500'">
                  Tanpa timer, jawaban & pembahasan langsung muncul
                </p>
              </div>
            </label>

            <!-- Review Mode -->
            <label
              class="flex items-center gap-3 rounded-xl p-3 transition-all duration-200 cursor-pointer border-2"
              [ngClass]="quizMode === 'review'
                ? (isDarkMode ? 'bg-amber-900/30 border-amber-500' : 'bg-amber-50 border-amber-500')
                : (isDarkMode ? 'bg-gray-700/60 border-transparent hover:border-gray-600' : 'bg-gray-50 border-transparent hover:border-gray-300')"
            >
              <input type="radio" [(ngModel)]="quizMode" value="review" name="quizMode" class="sr-only">
              <div class="flex-shrink-0 w-5 h-5 rounded-full border-2 flex items-center justify-center transition-colors"
                [ngClass]="quizMode === 'review'
                  ? 'border-amber-500'
                  : (isDarkMode ? 'border-gray-500' : 'border-gray-300')">
                <div *ngIf="quizMode === 'review'" class="w-2.5 h-2.5 rounded-full bg-amber-500"></div>
              </div>
              <div>
                <p class="text-sm font-semibold" [ngClass]="isDarkMode ? 'text-gray-100' : 'text-gray-800'">
                  Mode Review
                </p>
                <p class="text-xs mt-0.5" [ngClass]="isDarkMode ? 'text-gray-400' : 'text-gray-500'">
                  Cek jawaban per soal, lihat pembahasan
                </p>
              </div>
            </label>
          </div>
        </div>

        <!-- Start Button -->
        <button
          type="submit"
          [disabled]="!quizForm.form.valid"
          class="w-full flex items-center justify-center gap-2 py-3 px-4 rounded-xl text-base font-bold text-white shadow-md
                 transition-all duration-200 active:scale-95 disabled:opacity-50 disabled:cursor-not-allowed"
          [ngClass]="isDarkMode
            ? 'bg-indigo-600 hover:bg-indigo-500'
            : 'bg-indigo-600 hover:bg-indigo-700'"
        >
          {{ quizMode === 'exam' ? 'Mulai Kuis' : quizMode === 'study' ? 'Mulai Belajar' : 'Mulai Review' }}
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M13 7l5 5m0 0l-5 5m5-5H6"/>
          </svg>
        </button>
      </form>
    </div>
  </div>
</div>
