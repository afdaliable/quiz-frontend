<div class="min-h-screen bg-gray-50 py-8 px-4 sm:px-6 lg:px-8">
  <div class="max-w-2xl mx-auto">
    <div class="bg-white p-6 sm:p-8 rounded-xl shadow-lg">
      <h1 class="text-2xl sm:text-4xl font-extrabold text-gray-900 mb-6">
        Selamat Datang di Quiz App
      </h1>
      
      <form (ngSubmit)="startQuiz()" #quizForm="ngForm" class="space-y-6">
        <!-- User Info -->
        <div *ngIf="user" class="bg-gray-50 rounded-lg p-4">
          <p class="text-base sm:text-lg">
            <strong class="text-gray-700">Nama:</strong> 
            <span class="text-gray-900">{{ user.display_name }}</span>
          </p>
        </div>
        
        <!-- Quiz Info -->
        <div *ngIf="selectedPaket" class="bg-gray-50 rounded-lg p-4 space-y-2">
          <p class="text-base sm:text-lg">
            <strong class="text-gray-700">Kategori:</strong> 
            <span class="text-gray-900">{{ selectedPaket.kategori_soal }}</span>
          </p>
          <p class="text-base sm:text-lg">
            <strong class="text-gray-700">Nama Paket:</strong> 
            <span class="text-gray-900">{{ selectedPaket.nama_paket_soal }}</span>
          </p>
          <p class="text-base sm:text-lg">
            <strong class="text-gray-700">Jumlah Soal:</strong> 
            <span class="text-gray-900">{{ selectedPaket.jumlah_soal }}</span>
          </p>
        </div>
        
        <!-- Duration Selection -->
        <div class="space-y-2">
          <label for="durasi" class="block text-sm font-medium text-gray-700">
            Waktu Ujian
          </label>
          <select 
            id="durasi" 
            name="durasi" 
            [(ngModel)]="selectedDurasi" 
            required
            class="mt-1 block w-full rounded-md border-gray-300 py-3 pl-3 pr-10 text-base focus:border-indigo-500 focus:outline-none focus:ring-indigo-500 sm:text-sm"
          >
            <option *ngFor="let durasi of durasiOptions" [value]="durasi">
              {{ durasi }} menit
            </option>
          </select>
        </div>
        
        <!-- Start Button -->
        <button 
          type="submit" 
          [disabled]="!quizForm.form.valid"
          class="w-full flex justify-center py-3 px-4 border border-transparent rounded-md shadow-sm text-base sm:text-lg font-medium text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 disabled:opacity-50 disabled:cursor-not-allowed"
        >
          Mulai Kuis
        </button>
      </form>
    </div>
  </div>
</div>
