<div class="min-h-screen transition-colors duration-200" [ngClass]="isDarkMode ? 'bg-gray-900' : 'bg-gray-50'">
  <div class="max-w-2xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <div class="rounded-xl shadow-lg transition-colors duration-200" [ngClass]="isDarkMode ? 'bg-gray-800' : 'bg-white'">
      <div class="p-6 sm:p-8">
        <h1 class="text-2xl sm:text-4xl font-extrabold mb-6 transition-colors duration-200" [ngClass]="isDarkMode ? 'text-white' : 'text-gray-900'">
          Selamat Datang di Quiz App
        </h1>
        
        <form (ngSubmit)="startQuiz()" #quizForm="ngForm" class="space-y-6">
          <!-- User Info -->
          <div *ngIf="user" class="rounded-lg p-4 transition-colors duration-200" [ngClass]="isDarkMode ? 'bg-gray-700' : 'bg-gray-50'">
            <p class="text-base sm:text-lg transition-colors duration-200" [ngClass]="isDarkMode ? 'text-gray-200' : 'text-gray-700'">
              <strong>Nama        : </strong> 
              <span>{{ user.display_name }}</span>
            </p>
          </div>
          
          <!-- Quiz Info -->
          <div *ngIf="selectedPaket" class="rounded-lg p-4 space-y-2 transition-colors duration-200" [ngClass]="isDarkMode ? 'bg-gray-700' : 'bg-gray-50'">
            <p class="text-base sm:text-lg" [ngClass]="isDarkMode ? 'text-gray-200' : 'text-gray-700'">
              <strong>Kategori    : </strong> 
              <span>{{ selectedPaket.kategori_soal }}</span>
            </p>
            <p class="text-base sm:text-lg" [ngClass]="isDarkMode ? 'text-gray-200' : 'text-gray-700'">
              <strong>Paket Soal  : </strong> 
              <span>{{ selectedPaket.nama_paket_soal }}</span>
            </p>
            <p class="text-base sm:text-lg" [ngClass]="isDarkMode ? 'text-gray-200' : 'text-gray-700'">
              <strong>Jumlah Soal : </strong> 
              <span>{{ selectedPaket.jumlah_soal }}</span>
            </p>
          </div>

          <!-- Duration Selection -->
          <div>
            <label class="block text-base font-medium mb-2" [ngClass]="isDarkMode ? 'text-gray-200' : 'text-gray-700'">
              Pilih Durasi
            </label>
            <select 
              name="durasi" 
              [(ngModel)]="selectedDurasi" 
              required
              class="block w-full rounded-md py-3 pl-3 pr-10 text-base focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-colors duration-200"
              [ngClass]="isDarkMode ? 'bg-gray-700 text-white border-gray-600' : 'bg-white text-gray-900 border-gray-300'"
            >
              <option *ngFor="let durasi of durasiOptions" [value]="durasi">
                {{ durasi }} menit
              </option>
            </select>
          </div>
          
          <!-- Review Mode Toggle -->
          <div class="flex items-center space-x-3">
            <label class="relative inline-flex items-center cursor-pointer">
              <input type="checkbox" [(ngModel)]="isReviewMode" name="reviewMode" class="sr-only peer">
              <div class="w-11 h-6 bg-gray-200 peer-focus:outline-none peer-focus:ring-4 peer-focus:ring-indigo-300 dark:peer-focus:ring-indigo-800 rounded-full peer dark:bg-gray-700 peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all dark:border-gray-600 peer-checked:bg-indigo-600"></div>
            </label>
            <span class="text-base font-medium" [ngClass]="isDarkMode ? 'text-gray-200' : 'text-gray-700'">
              Review Mode
            </span>
          </div>
          
          <!-- Start Button -->
          <button 
            type="submit" 
            [disabled]="!quizForm.form.valid"
            class="w-full flex justify-center py-3 px-4 rounded-md shadow-sm text-base sm:text-lg font-medium text-white transition-colors duration-200"
            [ngClass]="isDarkMode ? 'bg-indigo-600 hover:bg-indigo-700' : 'bg-indigo-600 hover:bg-indigo-700'"
          >
            Mulai Kuis
          </button>
        </form>
      </div>
    </div>
  </div>
</div>
