<div class="min-h-screen transition-colors duration-200" [ngClass]="isDarkMode ? 'bg-gray-900' : 'bg-gray-50'">

  
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6">
    <!-- Timer and Question Content -->
    <div class="flex flex-col lg:flex-row gap-6">
      <div class="w-full lg:w-3/4">
        <div class="rounded-lg shadow-md p-6 mb-6" [ngClass]="isDarkMode ? 'bg-gray-800' : 'bg-white'">
          <div class="flex justify-between items-center mb-4">
            <span class="text-lg font-semibold" [ngClass]="isDarkMode ? 'text-white' : 'text-gray-900'">
              Waktu: {{ formatTime(remainingTime) }}
            </span>
            <button
              (click)="toggleMarkQuestion()"
              class="px-4 py-2 text-white rounded-lg transition-colors duration-200"
              [ngClass]="markedQuestions[currentQuestion] ? 'bg-yellow-500 hover:bg-yellow-600' : 'bg-blue-500 hover:bg-blue-600'"
            >
              {{ markedQuestions[currentQuestion] ? "Hapus Tanda" : "Tandai Soal" }}
            </button>
          </div>

          <!-- Question Content -->
          <div class="mb-6">
            <h3 class="text-xl font-bold mb-4" [ngClass]="isDarkMode ? 'text-white' : 'text-gray-900'">
              Soal {{ currentQuestion + 1 }}
            </h3>
            <p class="text-lg mb-6" [ngClass]="isDarkMode ? 'text-gray-200' : 'text-gray-700'">
              {{ questionList[currentQuestion]?.questionText }}
            </p>

            <!-- Options -->
            <div class="space-y-3">
              <div *ngFor="let option of questionList[currentQuestion]?.options; let i = index"
                (click)="answer(currentQuestion, i)"
                class="p-4 rounded-lg cursor-pointer transition-colors duration-200"
                [ngClass]="{
                  'bg-blue-600 text-white': selectedAnswers[currentQuestion] === i,
                  'bg-gray-700 text-gray-200 hover:bg-gray-600': isDarkMode && selectedAnswers[currentQuestion] !== i,
                  'bg-white border border-gray-300 hover:bg-gray-50': !isDarkMode && selectedAnswers[currentQuestion] !== i
                }"
              >
                {{ option.text }}
              </div>
            </div>
          </div>

          <!-- Navigation -->
          <div class="flex justify-between items-center">
            <button
              (click)="prevQuestion()"
              [disabled]="currentQuestion === 0"
              class="px-4 py-2 rounded-lg font-medium transition-colors duration-200"
              [ngClass]="isDarkMode ? 'bg-gray-700 text-white hover:bg-gray-600' : 'bg-white text-gray-700 border border-gray-300 hover:bg-gray-50'"
            >
              ← Sebelumnya
            </button>

            <button
              (click)="nextQuestion()"
              [disabled]="currentQuestion === questionList.length - 1"
              class="px-4 py-2 rounded-lg font-medium transition-colors duration-200"
              [ngClass]="isDarkMode ? 'bg-gray-700 text-white hover:bg-gray-600' : 'bg-white text-gray-700 border border-gray-300 hover:bg-gray-50'"
            >
              Selanjutnya →
            </button>
          </div>
        </div>
      </div>

      <!-- Question Navigation -->
      <div class="w-full lg:w-1/4">
        <div class="rounded-lg shadow-md p-4" [ngClass]="isDarkMode ? 'bg-gray-800' : 'bg-white'">
          <h3 class="text-lg font-semibold mb-4" [ngClass]="isDarkMode ? 'text-white' : 'text-gray-900'">
            Navigasi Soal
          </h3>
          <div class="grid grid-cols-6 sm:grid-cols-8 lg:grid-cols-5 gap-2 mb-4">
            <button
              *ngFor="let q of questionList; let i = index"
              (click)="goToQuestion(i)"
              class="aspect-square flex items-center justify-center text-sm font-medium rounded-lg transition-colors duration-200"
              [ngClass]="getQuestionButtonClass(i)"
            >
              {{ i + 1 }}
            </button>
          </div>

          <button
            (click)="confirmEndQuiz()"
            class="w-full mt-6 px-4 py-3 bg-red-500 text-white rounded-lg hover:bg-red-600 transition-colors duration-200 font-medium"
          >
            Akhiri Ujian
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
