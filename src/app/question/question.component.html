<div class="min-h-screen transition-colors duration-200" [ngClass]="isDarkMode ? 'bg-gray-900' : 'bg-gray-50'">

  
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6">
    <!-- Timer and Question Content -->
    <div class="flex flex-col lg:flex-row gap-6">
      <div class="w-full lg:w-3/4">
        <div class="rounded-lg shadow-md p-6 mb-6" [ngClass]="isDarkMode ? 'bg-gray-800' : 'bg-white'">
          <div class="flex justify-between items-center mb-4">
            <span class="text-lg font-semibold" [ngClass]="isDarkMode ? 'text-white' : 'text-gray-900'">
              Waktu: {{ formatTime(remainingTime) }}
            </span>
            <button
              (click)="toggleMarkQuestion()"
              class="px-4 py-2 text-white rounded-lg transition-colors duration-200"
              [ngClass]="markedQuestions[currentQuestion] ? 'bg-yellow-500 hover:bg-yellow-600' : 'bg-blue-500 hover:bg-blue-600'"
            >
              {{ markedQuestions[currentQuestion] ? "Hapus Tanda" : "Tandai Soal" }}
            </button>
          </div>

          <!-- Question Content -->
          <div class="mb-6">
            <h3 class="text-xl font-bold mb-4" [ngClass]="isDarkMode ? 'text-white' : 'text-gray-900'">
              Soal {{ currentQuestion + 1 }}
            </h3>
            <p class="text-lg mb-6" [ngClass]="isDarkMode ? 'text-gray-200' : 'text-gray-700'"
                 [innerHTML]="questionList[currentQuestion]?.questionText">
            </p>

            <!-- Review Mode Controls
            <div *ngIf="isReviewMode" class="mb-4">
              <button
                (click)="showAnswer()"
                *ngIf="correctAnswerIndex === null"
                class="px-4 py-2 bg-green-500 text-white rounded-lg hover:bg-green-600 transition-colors duration-200"
              >
                Lihat Jawaban
              </button>
              <button
                (click)="hideAnswer()"
                *ngIf="correctAnswerIndex !== null"
                class="px-4 py-2 bg-red-500 text-white rounded-lg hover:bg-red-600 transition-colors duration-200"
              >
                Sembunyikan Jawaban
              </button>
            </div> -->

            <!-- Options -->
            <div class="space-y-3">
              <div *ngFor="let option of questionList[currentQuestion]?.options; let i = index"
                (click)="answer(currentQuestion, i)"
                class="p-4 rounded-lg cursor-pointer transition-colors duration-200"
                [ngClass]="{
                  'bg-blue-600 text-white': selectedAnswers[currentQuestion] === i && !isAnswerChecked,
                  'bg-green-600 text-white': isReviewMode && isAnswerChecked && selectedAnswers[currentQuestion] === i && currentAnswerIsCorrect,
                  'bg-red-600 text-white': isReviewMode && isAnswerChecked && selectedAnswers[currentQuestion] === i && !currentAnswerIsCorrect,
                  'bg-gray-700 text-gray-200 hover:bg-gray-600': isDarkMode && selectedAnswers[currentQuestion] !== i,
                  'bg-white border border-gray-300 hover:bg-gray-50': !isDarkMode && selectedAnswers[currentQuestion] !== i
                }"
              >
                {{ option.text }}
              </div>
            </div>

            <!-- Review Mode Controls -->
            <div *ngIf="isReviewMode" class="mt-6 space-y-4">
              <!-- Check Answer Button -->
              <div class="flex justify-center">
                <button
                  *ngIf="!isAnswerChecked && selectedAnswers[currentQuestion] !== undefined"
                  (click)="checkAnswer()"
                  class="px-6 py-2 bg-blue-500 text-white rounded-lg hover:bg-blue-600 transition-colors duration-200"
                >
                  Cek Jawaban
                </button>
              </div>

              <!-- Answer Result and Explanation Button -->
              <div *ngIf="isAnswerChecked" class="space-y-4">
                <div class="text-center font-medium text-lg"
                     [ngClass]="currentAnswerIsCorrect ? 'text-green-500' : 'text-red-500'">
                  {{ currentAnswerIsCorrect ? 'Jawaban Benar!' : 'Jawaban Salah!' }}
                </div>

                <div class="flex justify-center">
                  <button
                    (click)="toggleExplanation()"
                    class="px-6 py-2 bg-indigo-500 text-white rounded-lg hover:bg-indigo-600 transition-colors duration-200"
                  >
                    {{ showExplanation ? 'Sembunyikan Penjelasan' : 'Lihat Penjelasan' }}
                  </button>
                </div>

                <!-- Answer Explanation -->
                <div *ngIf="showExplanation" class="p-4 rounded-lg" [ngClass]="isDarkMode ? 'bg-gray-700' : 'bg-gray-100'">
                  <h4 class="font-semibold mb-2" [ngClass]="isDarkMode ? 'text-white' : 'text-gray-900'">Penjelasan:</h4>
                  <p [ngClass]="isDarkMode ? 'text-gray-200' : 'text-gray-700'">
                    {{ questionList[currentQuestion]?.solution || 'Tidak ada penjelasan tersedia untuk soal ini.' }}
                  </p>
                </div>
              </div>
            </div>
          </div>

          <!-- Navigation -->
          <div class="flex justify-between items-center">
            <button
              (click)="prevQuestion()"
              [disabled]="currentQuestion === 0"
              class="px-4 py-2 rounded-lg font-medium text-white transition-colors duration-200"
              [ngClass]="[
                currentQuestion === 0 ? 'opacity-50 cursor-not-allowed' : 'cursor-pointer',
                'bg-blue-500 hover:bg-blue-600'
              ]"
            >
              ← Sebelumnya
            </button>

            <button
              (click)="nextQuestion()"
              [disabled]="currentQuestion === questionList.length - 1"
              class="px-4 py-2 rounded-lg font-medium text-white transition-colors duration-200"
              [ngClass]="[
                currentQuestion === questionList.length - 1 ? 'opacity-50 cursor-not-allowed' : 'cursor-pointer',
                'bg-blue-500 hover:bg-blue-600'
              ]"
            >
              Selanjutnya →
            </button>
          </div>
        </div>
      </div>

      <!-- Question Navigation -->
      <div class="w-full lg:w-1/4">
        <div class="rounded-lg shadow-md p-4" [ngClass]="isDarkMode ? 'bg-gray-800' : 'bg-white'">
          <h3 class="text-lg font-semibold mb-4" [ngClass]="isDarkMode ? 'text-white' : 'text-gray-900'">
            Navigasi Soal
          </h3>
          <div class="grid grid-cols-6 sm:grid-cols-8 lg:grid-cols-5 gap-2 mb-4">
            <button
              *ngFor="let q of questionList; let i = index"
              (click)="goToQuestion(i)"
              class="aspect-square flex items-center justify-center text-sm font-medium rounded-lg transition-colors duration-200"
              [ngClass]="getQuestionButtonClass(i)"
            >
              {{ i + 1 }}
            </button>
          </div>

          <button
            (click)="confirmEndQuiz()"
            class="w-full mt-6 px-4 py-3 bg-red-500 text-white rounded-lg hover:bg-red-600 transition-colors duration-200 font-medium"
          >
            Akhiri Ujian
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
