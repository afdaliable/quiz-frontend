<div class="min-h-screen transition-colors duration-200" [ngClass]="isDarkMode ? 'bg-gray-900' : 'bg-gray-50'">
  
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6">
    <div class="flex flex-col lg:flex-row gap-6">
      <!-- Categories Section - Shown above on mobile -->
      <div class="w-full lg:w-1/4 order-1 lg:order-2">
        <div class="rounded-lg shadow-md p-4 mb-6 lg:mb-0" [ngClass]="isDarkMode ? 'bg-gray-800' : 'bg-white'">
          <div class="flex justify-between items-center mb-4">
            <div class="flex items-center gap-2">
              <h3 class="text-lg font-semibold" [ngClass]="isDarkMode ? 'text-white' : 'text-gray-900'">
                Kategori
              </h3>
              <span 
                *ngIf="isCategoriesCollapsed"
                class="text-sm px-2 py-1 rounded-md"
                [ngClass]="isDarkMode ? 'bg-gray-700 text-gray-200' : 'bg-gray-100 text-gray-600'"
              >
                {{ selectedCategory || 'Semua Kategori' }}
              </span>
            </div>
            <button 
              (click)="toggleCategories()"
              class="p-2 rounded-lg transition-colors duration-200"
              [ngClass]="isDarkMode ? 'hover:bg-gray-700' : 'hover:bg-gray-100'"
            >
              <svg 
                class="w-5 h-5 transform transition-transform duration-200"
                [ngClass]="[
                  isDarkMode ? 'text-white' : 'text-gray-600',
                  isCategoriesCollapsed ? '-rotate-90' : ''
                ]"
                fill="none" 
                stroke="currentColor" 
                viewBox="0 0 24 24"
              >
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 9l-7 7-7-7" />
              </svg>
            </button>
          </div>
          <div 
            class="flex flex-wrap lg:flex-col gap-2 transition-all duration-200 overflow-hidden"
            [ngStyle]="{'max-height': isCategoriesCollapsed ? '0' : '1000px'}"
          >
            <button
              (click)="filterByCategory(null)"
              class="w-auto lg:w-full text-left px-3 py-2 rounded-lg text-sm font-medium transition-colors duration-200"
              [ngClass]="!selectedCategory ? 
                'bg-indigo-600 text-white' : 
                (isDarkMode ? 'bg-gray-700 text-gray-200 hover:bg-gray-600' : 'bg-white text-gray-700 border border-gray-300 hover:bg-gray-50')"
            >
              Semua Kategori
            </button>
            <button
              *ngFor="let category of categories"
              (click)="filterAndScrollToList(category.nama_kategori)"
              class="w-auto lg:w-full text-left px-3 py-2 rounded-lg text-sm font-medium transition-colors duration-200"
              [ngClass]="selectedCategory === category.nama_kategori ? 
                'bg-indigo-600 text-white' : 
                (isDarkMode ? 'bg-gray-700 text-gray-200 hover:bg-gray-600' : 'bg-white text-gray-700 border border-gray-300 hover:bg-gray-50')"
            >
              {{ category.nama_kategori }}
            </button>
          </div>
        </div>
      </div>

      <!-- Search and Quiz List Section -->
      <div id="quiz-list" class="w-full lg:w-3/4 order-2 lg:order-1">
        <!-- Search and Sort -->
        <div class="flex gap-4 items-center mb-6">
          <div class="flex-1">
            <input
              type="text"
              [(ngModel)]="searchTerm"
              (input)="searchPaketSoal()"
              placeholder="Cari paket soal..."
              class="w-full px-4 py-2 rounded-lg transition-colors duration-200"
              [ngClass]="isDarkMode ? 'bg-gray-700 text-white placeholder-gray-400' : 'bg-white text-gray-900 border border-gray-300'"
            />
          </div>
          
          <!-- Sort buttons -->
          <div class="flex gap-2">
            <button
              (click)="sortPaketSoal('nama_paket_soal')"
              class="px-3 py-2 rounded-lg text-sm font-medium transition-colors duration-200"
              [ngClass]="isDarkMode ? 'bg-gray-700 text-gray-200 hover:bg-gray-600' : 'bg-white text-gray-700 border border-gray-300 hover:bg-gray-50'"
            >
              Nama {{ sortField === 'nama_paket_soal' ? (sortDirection === 'asc' ? '↑' : '↓') : '' }}
            </button>
            <button
              (click)="sortPaketSoal('jumlah_soal')"
              class="px-3 py-2 rounded-lg text-sm font-medium transition-colors duration-200"
              [ngClass]="isDarkMode ? 'bg-gray-700 text-gray-200 hover:bg-gray-600' : 'bg-white text-gray-700 border border-gray-300 hover:bg-gray-50'"
            >
              Jumlah {{ sortField === 'jumlah_soal' ? (sortDirection === 'asc' ? '↑' : '↓') : '' }}
            </button>
          </div>
        </div>

        <!-- Paket Soal Grid -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
          <div
            *ngFor="let paket of filteredPaketSoalList"
            (click)="selectPaketSoal(paket)"
            class="rounded-lg shadow-md p-6 cursor-pointer transition-all duration-200 relative"
            [ngClass]="isDarkMode ? 'bg-gray-800 hover:bg-gray-700' : 'bg-white hover:shadow-lg'"
          >
            <!-- Premium Badge -->
            <div *ngIf="paket.is_premium" class="absolute top-0 right-0 transform translate-x-2 -translate-y-2">
              <div class="flex items-center justify-center h-8 px-3 rounded-full shadow-md" 
                   [ngClass]="isDarkMode ? 'bg-indigo-900 text-indigo-300' : 'bg-indigo-600 text-white'">
                <svg class="h-4 w-4 mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z" />
                </svg>
                <span class="text-xs font-bold">PREMIUM</span>
              </div>
            </div>
            
            <h3 class="text-lg font-semibold mb-2" [ngClass]="isDarkMode ? 'text-white' : 'text-gray-900'">
              {{ paket.nama_paket_soal }}
            </h3>
            <div class="space-y-1" [ngClass]="isDarkMode ? 'text-gray-300' : 'text-gray-500'">
              <p>Kategori: {{ paket.kategori_soal }}</p>
              <p>Jumlah Soal: {{ paket.jumlah_soal }}</p>
            </div>
            
            <!-- Access indicator for premium quizzes -->
            <div *ngIf="paket.is_premium" class="mt-3 flex items-center">
              <div *ngIf="hasPremiumAccess" class="flex items-center text-sm" [ngClass]="isDarkMode ? 'text-green-400' : 'text-green-600'">
                <svg class="h-4 w-4 mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />
                </svg>
                <span>You have access</span>
              </div>
              <div *ngIf="!hasPremiumAccess" class="flex items-center text-sm" [ngClass]="isDarkMode ? 'text-yellow-400' : 'text-yellow-600'">
                <svg class="h-4 w-4 mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                </svg>
                <span>Requires subscription</span>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  
  <!-- Premium Access Modal -->
  <app-premium-access-modal 
    *ngIf="showPremiumModal && selectedPremiumQuiz" 
    [isDarkMode]="isDarkMode"
    [quizName]="selectedPremiumQuiz.nama_paket_soal"
    [availablePlans]="availablePlans"
    (close)="closePremiumModal()">
  </app-premium-access-modal>
</div>
