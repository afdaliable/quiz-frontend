<div class="min-h-screen flex items-center justify-center bg-gray-50 py-12 px-4 sm:px-6 lg:px-8">
  <div class="max-w-md w-full space-y-8">
    <div>
      <div class="flex justify-center">
        <div class="text-red-500">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-24 w-24" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
          </svg>
        </div>
      </div>
      <h2 class="mt-6 text-center text-3xl font-extrabold text-gray-900">
        Sesi Berakhir
      </h2>
      <p class="mt-2 text-center text-sm text-gray-600">
        Sesi kamu sudah tidak valid. Ini bisa terjadi karena:
      </p>
      <ul class="mt-4 list-disc pl-8 text-gray-600">
        <li>Kamu login dari perangkat lain</li>
        <li>Sesi kamu sudah kedaluwarsa</li>
        <li>Kredensial akun kamu berubah</li>
      </ul>
      <p class="mt-4 text-center text-sm text-gray-600">
        Demi keamanan, hanya satu sesi aktif yang diizinkan.
      </p>
    </div>
    <div class="mt-8">
      <button 
        (click)="goToLogin()" 
        class="group relative w-full flex justify-center py-2 px-4 border border-transparent text-sm font-medium rounded-md text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500"
      >
        Go to Login ({{ countdown }}s)
      </button>
    </div>
  </div>
</div>
